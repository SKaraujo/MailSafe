<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MailSafe — Simulador de Segurança em E-mails</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f8fc;color:#202124}button,input{font:inherit}button{cursor:pointer}
.topbar{height:72px;display:flex;align-items:center;gap:22px;padding:0 24px;background:#fff;border-bottom:1px solid #e4e7ec;position:sticky;top:0;z-index:5}
.brand{font-size:23px;font-weight:700;color:#174ea6;white-space:nowrap}.search{flex:1;max-width:680px;background:#edf2fc;border-radius:28px;display:flex;align-items:center;padding:0 18px;gap:10px}.search input{width:100%;border:0;outline:0;background:transparent;padding:14px 0}.profile{margin-left:auto;background:#d3e3fd;color:#174ea6;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-weight:bold}
.layout{display:flex;min-height:calc(100vh - 72px)}.sidebar{width:240px;padding:22px 12px;flex-shrink:0}.compose{border:0;background:#c2e7ff;border-radius:16px;padding:15px 20px;margin:0 0 20px 8px;font-weight:600;color:#001d35;box-shadow:0 1px 2px #0001}
.nav-item{border:0;width:100%;text-align:left;background:transparent;padding:12px 16px;border-radius:0 22px 22px 0;margin:2px 0;color:#30343b;display:flex;align-items:center;gap:14px}.nav-item:hover{background:#e9eef6}.nav-item.active{background:#d3e3fd;font-weight:bold;color:#174ea6}.count{margin-left:auto;font-size:12px}
.main{flex:1;min-width:0;padding:24px}.panel{background:#fff;border-radius:16px;min-height:400px;overflow:hidden;box-shadow:0 1px 3px #0000000d}.panel-head{display:flex;align-items:center;gap:12px;padding:20px 24px;border-bottom:1px solid #eceff3;flex-wrap:wrap}.panel-head h1{font-size:21px;font-weight:500;margin:0;flex:1}.score{font-size:13px;font-weight:bold;color:#17663b;background:#e0f2e8;border-radius:20px;padding:9px 12px;white-space:nowrap}
.notice{padding:14px 24px;background:#fff8e1;border-bottom:1px solid #f2e5b7;font-size:14px;line-height:1.5}.email-row{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 70px;gap:14px;align-items:center;padding:16px 22px;border-bottom:1px solid #edf0f2;cursor:pointer}.email-row:hover{box-shadow:inset 0 0 0 999px #f4f8ff}.email-row.unread .sender,.email-row.unread .subject{font-weight:700}.sender,.subject{overflow-wrap:anywhere}.preview{color:#5f6368;font-size:14px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{text-align:right;font-size:12px;color:#5f6368;white-space:nowrap}.empty{padding:55px 20px;text-align:center;color:#69717d}.hidden{display:none!important}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 18px;border-bottom:1px solid #e7e9ee;margin-bottom:22px}.icon-btn,.action-btn{border:0;border-radius:8px;padding:10px 12px;background:#f0f3f8;color:#30343b}.icon-btn:hover,.action-btn:hover{background:#e2e8f2}.message-subject{font-size:23px;margin:0 0 20px;overflow-wrap:anywhere}.message-meta{font-size:14px;color:#5f6368;line-height:1.8;margin-bottom:24px;overflow-wrap:anywhere}.message-body{white-space:pre-line;line-height:1.8;overflow-wrap:anywhere;margin:20px 0 28px}.message-actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:18px;border-top:1px solid #edf0f2}.btn-safe{background:#dff3e5;color:#17663b}.btn-spam{background:#fff0c2;color:#785500}.btn-phish{background:#fde0e0;color:#a51d1d}.btn-delete{background:#f0f1f3;color:#353942}.feedback{padding:16px;border-radius:10px;margin-top:18px;line-height:1.6}.feedback h3{margin:0 0 8px}.feedback p{margin:6px 0}.result{padding:28px;line-height:1.7}.result h2{margin-top:0}.primary{background:#174ea6;color:white;border:0;border-radius:8px;padding:11px 16px;margin-top:16px}
@media(max-width:760px){.topbar{padding:0 14px;gap:12px}.brand{font-size:19px}.sidebar{width:auto;padding:10px;display:flex;flex-wrap:wrap;align-items:center}.compose{margin:0 6px 8px 0;padding:11px}.nav-item{width:auto;border-radius:20px;padding:10px;gap:7px}.layout{display:block}.main{padding:12px}.panel-head{padding:17px}.email-row{grid-template-columns:minmax(0,1fr) 55px;gap:8px;padding:14px}.sender{grid-column:1}.details{grid-column:1}.time{grid-column:2;grid-row:1}.profile{display:none}.search{max-width:none}}
</style>
</head>
<body>
<header class="topbar">
 <div class="brand">✉ MailSafe</div>
 <label class="search">🔎 <input id="searchInput" type="search" placeholder="Pesquisar e-mails" aria-label="Pesquisar e-mails"></label>
 <div class="profile" title="Perfil de demonstração">M</div>
</header>
<div class="layout">
 <aside class="sidebar">
  <button class="compose" onclick="alert('Esta é uma simulação educativa: o envio de e-mails não está habilitado.')">✎ Escrever</button>
  <button class="nav-item active" data-folder="inbox" onclick="openFolder('inbox')">📥 Caixa de entrada <span class="count" id="count-inbox"></span></button>
  <button class="nav-item" data-folder="trusted" onclick="openFolder('trusted')">✅ Confiáveis <span class="count" id="count-trusted"></span></button>
  <button class="nav-item" data-folder="spam" onclick="openFolder('spam')">⚠️ Spam <span class="count" id="count-spam"></span></button>
  <button class="nav-item" data-folder="reported" onclick="openFolder('reported')">🚨 Denunciados <span class="count" id="count-reported"></span></button>
  <button class="nav-item" data-folder="trash" onclick="openFolder('trash')">🗑️ Lixeira <span class="count" id="count-trash"></span></button>
 </aside>
 <main class="main"><section class="panel">
  <div class="panel-head"><h1 id="folderTitle">Caixa de entrada</h1><div class="score" id="score">⭐ Pontos: 0/12</div></div>
  <div id="notice" class="notice"><strong>🎯 Desafio de segurança:</strong> abra cada mensagem e escolha uma ação. Cada classificação correta vale 2 pontos. Os e-mails e remetentes são fictícios.</div>
  <div id="listView"></div>
  <article id="messageView" class="hidden" style="padding:22px 26px">
   <div class="toolbar">
    <button class="icon-btn" onclick="backToFolder()">← Voltar</button>
    <button class="icon-btn" onclick="moveTo('trash')">🗑️ Excluir</button>
    <button class="icon-btn" onclick="moveTo('spam')">⚠️ Mover para spam</button>
    <button class="icon-btn" onclick="moveTo('reported')">🚨 Denunciar phishing</button>
   </div>
   <h2 class="message-subject" id="messageSubject"></h2><div class="message-meta" id="messageMeta"></div><hr style="border:0;border-top:1px solid #edf0f2">
   <div class="message-body" id="messageBody"></div><div id="decisionArea"></div><div id="feedback" class="hidden"></div>
  </article>
  <section id="resultView" class="hidden result"></section>
 </section></main>
</div>
<script>
const messages=[
{id:1,sender:"Loja Exemplo",address:"pedidos@lojaexemplo.com",subject:"Confirmação do seu pedido",preview:"Seu pedido foi registrado com sucesso...",time:"09:15",body:"Olá!\n\nSeu pedido foi registrado com sucesso.\n\nPara consultar os detalhes, abra o aplicativo ou acesse o site oficial da loja digitando o endereço no navegador.\n\nObrigado pela preferência!",expected:"trusted",reason:"A mensagem não exige senha, pagamento extra ou ação urgente. Mesmo assim, verifique o remetente e o pedido pelos canais oficiais."},
{id:2,sender:"Central de Segurança",address:"alerta@seguranca-exemplo.invalid",subject:"URGENTE! Sua conta será bloqueada",preview:"Regularize sua conta imediatamente...",time:"09:22",body:"ATENÇÃO!\n\nDetectamos um problema na sua conta. Ela será bloqueada em poucos minutos se você não tomar uma providência.\n\nAbra o anexo desta mensagem para consultar as instruções.\n\nEsta é uma simulação educativa. Não abra anexos reais de remetentes suspeitos.",expected:"phishing",reason:"A ameaça de bloqueio imediato, a urgência e o anexo inesperado são sinais de alerta. O domínio .invalid é fictício e não leva a um serviço real."},
{id:3,sender:"Você Foi Premiado",address:"premio@campanha-exemplo.invalid",subject:"Parabéns! Você ganhou R$ 5.000",preview:"Resgate seu prêmio agora...",time:"09:37",body:"PARABÉNS!\n\nVocê foi selecionado para receber um prêmio de R$ 5.000!\n\nPara liberar o valor, precisamos dos seus dados pessoais e do pagamento de uma pequena taxa de processamento.\n\nCorra! A oportunidade termina hoje.",expected:"phishing",reason:"Prêmio inesperado, pedido de dados pessoais, cobrança antecipada e pressão por tempo são sinais fortes de golpe."},
{id:4,sender:"Serviço de Conta",address:"notificacoes@conta-exemplo.invalid",subject:"Solicitação de redefinição de senha",preview:"Recebemos uma solicitação de alteração...",time:"10:04",body:"Olá!\n\nRecebemos uma solicitação de redefinição de senha.\n\nSe foi você, siga as instruções no aplicativo ou site oficial do serviço.\n\nSe não foi você, acesse sua conta diretamente pelo endereço oficial e verifique a segurança.\n\nNão compartilhe códigos de verificação.",expected:"trusted",reason:"A mensagem orienta a usar o canal oficial e não pede senha ou códigos. Se você não solicitou a alteração, verifique a conta diretamente pelo serviço oficial."},
{id:5,sender:"Equipe de Cadastro",address:"cadastro@atualizacao-exemplo.invalid",subject:"Atualização obrigatória em 30 minutos",preview:"Envie seu documento e senha...",time:"10:18",body:"Prezado cliente,\n\nSeu cadastro será cancelado em 30 minutos.\n\nResponda a este e-mail com uma cópia do seu documento e sua senha para evitar o bloqueio.\n\nNão ignore este aviso!",expected:"phishing",reason:"Solicitar senha por e-mail, exigir documento e impor um prazo curto são sinais muito fortes de fraude."},
{id:6,sender:"Ofertas da Semana",address:"ofertas@newsletter-exemplo.com",subject:"Promoções e novidades da semana",preview:"Confira nossa seleção de produtos e descontos...",time:"10:31",body:"Olá!\n\nConfira as ofertas e novidades desta semana em nossa loja. Você receberá mensagens promocionais como esta periodicamente.\n\nSe não quiser mais receber novidades, use a opção de descadastro no site oficial da loja.\n\nEsta mensagem é um exemplo fictício de spam comercial: é indesejada ou repetitiva, mas não apresenta sinais claros de tentativa de roubo de dados.",expected:"spam",reason:"Este é um exemplo de spam comercial: uma mensagem promocional que pode ser indesejada ou repetitiva, mas não tenta roubar sua senha nem usa ameaça ou prêmio falso. A melhor decisão neste desafio é movê-la para Spam."}
];
const folderNames={inbox:"Caixa de entrada",trusted:"Confiáveis",spam:"Spam",reported:"Denunciados",trash:"Lixeira"};
let folder="inbox",currentId=null,points=0,answers={},locations={},readIds=new Set();
messages.forEach(m=>locations[m.id]="inbox");
function updateCounts(){for(const f of Object.keys(folderNames)){const n=messages.filter(m=>locations[m.id]===f).length;document.getElementById("count-"+f).textContent=n?String(n):""}document.getElementById("score").textContent=`⭐ Pontos: ${points}/12`}
function openFolder(f){folder=f;document.getElementById("folderTitle").textContent=folderNames[f];document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.folder===f));document.getElementById("notice").classList.toggle("hidden",f!=="inbox");document.getElementById("messageView").classList.add("hidden");document.getElementById("resultView").classList.add("hidden");document.getElementById("listView").classList.remove("hidden");renderList()}
function renderList(){const list=document.getElementById("listView");list.innerHTML="";const q=document.getElementById("searchInput").value.trim().toLowerCase();const items=messages.filter(m=>locations[m.id]===folder&&[m.sender,m.address,m.subject,m.preview].join(" ").toLowerCase().includes(q));if(!items.length){list.innerHTML='<div class="empty">Nenhuma mensagem nesta pasta.</div>';return}items.forEach(m=>{const row=document.createElement("div");row.className="email-row"+(readIds.has(m.id)?"":" unread");const sender=document.createElement("div");sender.className="sender";sender.textContent=m.sender;const details=document.createElement("div");details.className="details";const subject=document.createElement("div");subject.className="subject";subject.textContent=m.subject;const preview=document.createElement("div");preview.className="preview";preview.textContent=m.preview;details.append(subject,preview);const time=document.createElement("div");time.className="time";time.textContent=m.time;row.append(sender,details,time);row.onclick=()=>openMessage(m.id);list.appendChild(row)})}
function openMessage(id){currentId=id;const m=messages.find(x=>x.id===id);readIds.add(id);document.getElementById("listView").classList.add("hidden");document.getElementById("messageView").classList.remove("hidden");document.getElementById("resultView").classList.add("hidden");document.getElementById("messageSubject").textContent=m.subject;document.getElementById("messageMeta").textContent=`De: ${m.sender} <${m.address}>\nHorário: ${m.time}`;document.getElementById("messageBody").textContent=m.body;const area=document.getElementById("decisionArea");area.innerHTML="";const feedback=document.getElementById("feedback");feedback.className="hidden";feedback.innerHTML="";if(!answers[id]&&folder!=="trash"){const title=document.createElement("p");title.innerHTML="<strong>Qual é a sua decisão sobre esta mensagem?</strong>";area.appendChild(title);const actions=document.createElement("div");actions.className="message-actions";[["trusted","✓ Marcar como confiável","btn-safe"],["spam","⚠️ Mover para spam","btn-spam"],["reported","🚨 Denunciar phishing","btn-phish"]].forEach(([value,label,cls])=>{const b=document.createElement("button");b.className="action-btn "+cls;b.textContent=label;b.onclick=()=>classify(value);actions.appendChild(b)});area.appendChild(actions)}else if(answers[id]){const p=document.createElement("p");p.textContent="Este e-mail já foi classificado. Você pode movê-lo para outra pasta usando as ações acima.";area.appendChild(p)}}
function isCorrect(choice, expected){if(expected==="trusted")return choice==="trusted";if(expected==="spam")return choice==="spam";return choice==="spam"||choice==="reported";}
function classify(choice){const m=messages.find(x=>x.id===currentId);if(!m||answers[m.id])return;const correct=isCorrect(choice,m.expected);answers[m.id]=choice;if(correct)points+=2;locations[m.id]=choice;updateCounts();const fb=document.getElementById("feedback");fb.className="feedback";fb.style.background=correct?"#e0f2e8":"#fde8e8";fb.style.color=correct?"#17663b":"#922020";fb.innerHTML="";const h=document.createElement("h3");h.textContent=correct?"✅ Decisão correta! +2 pontos":"❌ Decisão incorreta";const p=document.createElement("p");p.textContent=m.reason;const p2=document.createElement("p");p2.textContent="Classificação esperada: "+(m.expected==="trusted"?"Confiável":(m.expected==="spam"?"Spam comercial":"Fraudulento / phishing"))+".";const p3=document.createElement("p");p3.textContent="A mensagem foi movida para: "+folderNames[choice]+".";fb.append(h,p,p2,p3);const area=document.getElementById("decisionArea");area.innerHTML="";const b=document.createElement("button");b.className="primary";b.textContent=Object.keys(answers).length===messages.length?"Ver resultado final":"Continuar";b.onclick=()=>Object.keys(answers).length===messages.length?showResult():openFolder("inbox");area.appendChild(b)}
function moveTo(destination){
 if(currentId===null)return;
 // Se ainda não respondeu ao desafio, as ações da barra também contam como decisão.
 if(!answers[currentId]){
  classify(destination);
  return;
 }
 locations[currentId]=destination;
 updateCounts();
 openFolder(destination);
}
function backToFolder(){openFolder(folder)}
function showResult(){document.getElementById("messageView").classList.add("hidden");document.getElementById("listView").classList.add("hidden");document.getElementById("notice").classList.add("hidden");const view=document.getElementById("resultView");view.classList.remove("hidden");const correct=Object.keys(answers).filter(id=>isCorrect(answers[id],messages.find(m=>m.id===Number(id)).expected)).length;view.innerHTML="";const h=document.createElement("h2");h.textContent="🏆 Desafio concluído!";const score=document.createElement("h3");score.textContent=`Pontuação: ${points}/12`;const p=document.createElement("p");p.textContent=`Você classificou ${Object.keys(answers).length} de ${messages.length} mensagens e acertou ${correct}.`;const p2=document.createElement("p");p2.textContent=points===12?"Excelente! Você reconheceu todos os exemplos.":points>=6?"Bom trabalho! Continue observando remetentes, urgência e pedidos de dados.":"Continue praticando: desconfie de urgência, pedidos de senha e anexos inesperados.";const p3=document.createElement("p");p3.textContent="A classificação é educativa e baseada nas mensagens fictícias. Na prática, confirme informações pelos canais oficiais.";const b=document.createElement("button");b.className="primary";b.textContent="Reiniciar desafio";b.onclick=restart;view.append(h,score,p,p2,p3,b);document.getElementById("folderTitle").textContent="Resultado final"}
function restart(){points=0;answers={};currentId=null;readIds=new Set();messages.forEach(m=>locations[m.id]="inbox");document.getElementById("searchInput").value="";updateCounts();openFolder("inbox")}
document.getElementById("searchInput").addEventListener("input",renderList);updateCounts();openFolder("inbox");
</script>
</body>
</html>
